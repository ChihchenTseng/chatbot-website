<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>溫柔聊天機器人</title>
  <style>
    body {
      font-family: 'Microsoft JhengHei', sans-serif;
      background-color: #fff8f0;
      margin: 0;
      padding: 20px;
    }
    #chatbox {
      width: 100%;
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .msg {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    .user {
      background-color: #dceeff;
      text-align: right;
    }
    .bot {
      background-color: #fcefe6;
      text-align: left;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
    }
    #inputArea {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    #inputArea input {
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="chatbox">
    <div id="messages"></div>
    <div id="inputArea">
      <input type="text" id="userInput" placeholder="輸入你的訊息..." onkeypress="if(event.key==='Enter'){sendMessage()}">
      <button onclick="sendMessage()">送出</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML += `<div class='msg user'>${text}</div>`;
      input.value = '';

      const prompt = `你是一個溫柔又善解人意的聊天夥伴，請用柔和關懷的語氣回答：${text}`;

      try {
        const res = await fetch("https://generativelanguage.googleapis.com/v1/models/gemini-1.5-pro:generateContent?key=AIzaSyBTSR7_1qFIfJO4lOZp2-uAhXO0SdrbZyI", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [
              { parts: [{ text: prompt }] }
            ]
          })
        });

        const data = await res.json();
        console.log(data); // 除錯用
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，我剛剛沒聽清楚，可以再說一次嗎？";
        messagesDiv.innerHTML += `<div class='msg bot'>${reply}</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight; // 自動捲到底
      } catch (error) {
        console.error("⚠️ 錯誤：", error);
        messagesDiv.innerHTML += `<div class='msg bot'>發生錯誤了，請稍後再試。</div>`;
      }
    }
  </script>
</body>
</html>
